<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b0a">
  <meta name="application-name" content="OzancicakMovie">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>Menonton — OzancicakMovie</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="watch-page">
  <div class="ambient ambient-one"></div>
  <header class="site-header watch-header">
    <a class="back-link" href="index.html" aria-label="Kembali ke katalog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>Kembali</span>
    </a>
    <a class="brand" href="index.html"><img class="brand-logo" src="https://img.icons8.com/3d-fluency/94/melting-face-2.png" alt="" width="38" height="38"><span>OZANCICAKMOVIE</span></a>
    <span class="watching-label">NOW PLAYING</span>
  </header>

  <main class="watch-main">
    <section class="player-shell">
      <div class="player-frame" id="playerFrame">
        <video id="video" controls playsinline preload="auto"></video>
        <div id="playerPlaceholder" class="player-placeholder">
          <span class="loader"></span>
          <p>Menyiapkan pemutar...</p>
        </div>
        <div id="playerError" class="player-error" hidden>
          <span>!</span>
          <h2>Video belum dapat diputar</h2>
          <p id="playerErrorText">Sumber video tidak tersedia.</p>
          <button id="retryStream" class="button button-primary" type="button">Coba lagi</button>
        </div>
      </div>
      <div class="player-toolbar">
        <div>
          <span class="live-dot"></span>
          <span id="episodeNow">Film</span>
          <small id="sourceStatus" class="source-status" aria-live="polite">Menyiapkan sumber...</small>
        </div>
        <label class="quality-control">Kualitas
          <select id="qualitySelect" disabled><option>Otomatis</option></select>
        </label>
      </div>
      <div id="episodeActions" class="episode-actions" hidden>
        <button id="previousEpisode" type="button">&larr; Sebelumnya</button>
        <button id="autoplayToggle" type="button" aria-pressed="true">Putar otomatis: Aktif</button>
        <button id="nextEpisode" type="button">Berikutnya &rarr;</button>
      </div>
    </section>

    <section class="detail-layout">
      <article class="movie-detail">
        <div class="detail-topline">
          <span id="detailType" class="pill">FILM</span>
          <span id="detailRating" class="rating">★ —</span>
          <button id="watchFavorite" class="watch-favorite" type="button" aria-label="Tambahkan ke favorit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S4 16 4 9.6A4.1 4.1 0 0 1 11.1 6.8L12 8l.9-1.2A4.1 4.1 0 0 1 20 9.6c0 6.4-8 10.9-8 10.9Z"/></svg>
            <span>Favorit</span>
          </button>
        </div>
        <h1 id="detailTitle">Memuat judul...</h1>
        <p id="detailMeta" class="detail-meta"></p>
        <p id="detailDescription" class="detail-description">Informasi film sedang dimuat.</p>
        <div id="genreList" class="genre-list"></div>
      </article>
      <aside class="poster-panel">
        <img id="detailPoster" alt="" src="">
        <div><small>PEMERAN</small><p id="castList">—</p></div>
      </aside>
    </section>

    <section id="episodeSection" class="episode-section" hidden>
      <div class="section-heading compact">
        <div><span class="eyebrow muted">Lanjutkan cerita</span><h2>Episode</h2></div>
        <label class="season-control">Musim <select id="seasonSelect"></select></label>
      </div>
      <div id="episodeList" class="episode-list"></div>
    </section>

    <section class="recommend-section">
      <div class="section-heading compact"><div><span class="eyebrow muted">Masih satu suasana</span><h2>Rekomendasi lainnya</h2></div></div>
      <div id="recommendations" class="card-grid compact-grid"></div>
    </section>
  </main>

  <script src="storage.js?v=1"></script>
  <script src="watch.js?v=4"></script>
  <script src="pwa.js?v=1"></script>
</body>
</html>
